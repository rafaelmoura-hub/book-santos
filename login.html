<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Santos | Login</title>
    <link rel="stylesheet" href="login.css">
<script src="assets/events.js" defer></script>
</head>
<body>
    <div class="login-box">
        <h1>Book Santos</h1>
        <p>Entre para continuar.</p>
        <form data-on-submit="entrar(event)">
        <label for="login">E-mail</label>
        <input type="email" id="login" aria-label="E-mail" placeholder="seu@email.com" maxlength="254" autocomplete="username" required>
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Sua senha" maxlength="100" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
        </form>
        <p id="mensagem" role="status" aria-live="polite"></p>
    </div>
    <script src="assets/api.js"></script>
    <script src="login.js"></script>
</body>
</html>
