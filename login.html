<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOK TASK | Login</title>
    <script src="/assets/theme.js"></script>
    <link rel="icon" href="/assets/book-task-logo.png" type="image/png">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="/assets/brand.css">
    <link rel="stylesheet" href="/assets/layout.css">
    <script src="assets/accessibility.js" defer></script>
<script src="assets/events.js" defer></script>
</head>
<body class="login-page">
    <aside class="login-brand-panel" aria-label="BOOK TASK">
        <div class="login-brand-copy"><p class="login-brand-name">BOOK TASK</p><p>Gestão operacional dos seus imóveis.<br>Mais organização para o dia a dia.</p></div>
        <img class="login-skyline" src="/assets/login-skyline.svg" alt="" width="600" height="440">
    </aside>
    <main class="login-box">
        <h1 class="brand-heading"><img class="brand-logo" src="/assets/book-task-logo.png" width="128" height="128" alt="BOOK TASK — Gestão Operacional" decoding="async"></h1>
        <h2>Bem-vindo ao BOOK TASK</h2>
        <p>Acesse sua operação.</p>
        <form data-on-submit="entrar(event)">
        <label for="login">E-mail</label>
        <input type="email" id="login" aria-label="E-mail" placeholder="seu@email.com" maxlength="254" autocomplete="username" required>
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Sua senha" maxlength="100" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
        </form>
        <p id="mensagem" role="status" aria-live="polite"></p>
    </main>
    <noscript>Ative o JavaScript para entrar. Os documentos de <a href="/legal/privacidade">privacidade</a> estão disponíveis sem JavaScript.</noscript>
    <script src="assets/api.js"></script>
    <script src="login.js"></script>
</body>
</html>
