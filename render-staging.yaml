services:
  - type: web
    name: book-santos-staging
    branch: staging
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm test && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: HOST
        value: 0.0.0.0
      - key: BOOK_ENVIRONMENT
        value: staging
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: BOOK_PRODUCTION_SUPABASE_URL
        sync: false
